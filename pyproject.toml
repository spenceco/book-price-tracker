[project]
name = "price-tracker"
version = "1.0.0"
description = "Polite book price scraper with SQLite price history and Excel/CSV reports"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
price-tracker = "price_tracker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["price_tracker"]

[tool.ruff]
line-length = 110
